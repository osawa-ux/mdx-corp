# GitHub Pages (Jekyll) 設定
#
# 本サイトは静的HTMLだが GitHub Pages 既定の Jekyll ビルダーで配信される。
# docs/ は内部用の ADR / 設計ドキュメント。docs/decisions/adr-template.md の
# front matter にあるプレースホルダ日付 (date: YYYY-MM-DD) を theme layout の
# date フィルタが評価して "Invalid Date" 例外を投げ、サイト全体が build 不能に
# なるため、docs/ を build 対象外にする。
#
# Jekyll を有効なまま (=.nojekyll を置かない) にすることで、Jekyll 既定の
# ドットファイル除外が効き、.env.example / .gitignore 等が公開されない。
#
# 2026-07-30 追加: 内部用ドキュメント・スクリプトが会社公式ドメインで
# 配信されていた（https://mdx-inc.co.jp/CLAUDE.md 等が HTTP 200）ため、
# サイト表示に不要な内部ファイルを build 対象外にする。
# repo は public のため GitHub 上では引き続き閲覧可能（それは許容）。
# 公式ドメイン配下で配信しない、が本 exclude の目的。
exclude:
  - docs/
  - CLAUDE.md
  - README.md
  - tools/
  - requirements.txt
